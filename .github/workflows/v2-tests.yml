name: V2 BTC Engine Tests
on:
  push:
    branches: [v2-btc-trading-agent]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.3.1 numpy==1.26.4 pytest
      - name: Run deterministic engine tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q v2/tests
